# Hopper batch, slice 1 of 3: intake rules. One file, 40 lines.
# The test file is the contract Grok accepted on Nov 22. It is never sent to the model.
# There is no solution to this task anywhere in this repository, and there must not be one.
# Nothing here runs in November. December holds three passing calls and no more, in this order:
# hopper-intake, hopper-dupes, hopper-package. A failure spends the attempt and stops the batch.
id: hopper-intake
kind: r3
prose: Write a Python module intake.py for an idea bank. It is pure: it never reads a file, opens a socket, starts a process or looks at the clock, and it never changes anything passed in. It defines check_submission(submission, caller, roster). submission is a dict that may have the keys text, lane, source and submitter, plus other keys that are ignored; a missing key counts as None. caller is a dict, either {"kind": "person", "email": an email string} or {"kind": "service", "name": a system name string}. roster is a set of email strings. Return None when the submission is accepted. Otherwise return one of five strings, the first that applies in this order. not_on_roster: the caller is a person whose email is not in roster. wrong_submitter: the submission's submitter is not exactly the caller's own email, for a person, or the caller's own name, for a service. empty_text: text is missing, None, empty, or nothing but whitespace. bad_lane: lane is present and not None and is not exactly one of the lowercase strings apparel, content, story; a missing lane or None is accepted. bad_source: source is not exactly one of the lowercase strings team, seed, warp, scout, transcript, luma, public. A service is never checked against the roster, and a service's source does not have to match its name.
impl: intake.py
test: inbox/hopper_intake_test.py
expect_sha256: f1a6223ff5f97b8e52bfb035aa533f3cc38d3f801669528531c094b63937d12f
