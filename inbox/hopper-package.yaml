# Hopper batch, slice 3 of 3: the package. Three files, 120 lines.
# The test file is the contract Grok accepted on Nov 22. It is never sent to the model.
# There is no solution to this task anywhere in this repository, and there must not be one.
# Nothing here runs in November. December holds three passing calls and no more, in this order:
# hopper-intake, hopper-dupes, hopper-package. A failure spends the attempt and stops the batch.
id: hopper-package
kind: r3
prose: Write three Python modules for an idea bank. All are pure: each never reads a file, opens a socket, starts a process or looks at the clock, and it never changes anything passed in. filenames.py defines numbered(prefix, paths). paths is a list of file path strings. Return a list with one name per path, in order: the prefix, a hyphen, the position counting from 1, then the path's own file extension exactly as written, with its dot and its case, as os.path.splitext gives it. A path with no extension gets none. So numbered("concept", ["a/b/x.png", "y.webp"]) is ["concept-1.png", "concept-2.webp"], and an empty list gives an empty list. confirm.py defines confirm_text(concept_count). With CONFIRM = "This hands a package to Warp. It will show up in Warp's review queue." it returns CONFIRM when concept_count is above 0, and CONFIRM + " No concepts attached." when concept_count is 0. package.py defines build_package(promotion, idea, concepts, reference_images, names) and returns a new dict. promotion is a dict with id, promoted_by, created (a timezone-aware datetime) and concept_ids (a list of concept ids, in the order they were ticked). idea is a dict with id, text, lane, source, source_ref, submitter, reviewer_notes and scout_motive. concepts is a list of dicts with id, model, prompt, seed and file_path. reference_images is a list of file path strings. names is a dict from an email to a display name. The result has exactly these keys, in this order: schema, promotion_id, idea, promoted_by, promoted_at, reviewer_notes, scout, concepts, reference_images. schema is the int 1. promotion_id is the promotion's id. idea is a dict with exactly the keys id, text, lane, source, source_ref, submitter in that order, copied from the idea, except submitter. For the idea's submitter and for promoted_by: a value with an @ in it is a person's email and is replaced by names[value], and if it is not in names raise ValueError; a value with no @ is a system name and is used as it is, whether or not it is in names. promoted_at is created converted to UTC and written like 2026-12-08T15:02:00Z, to the whole second, with the fraction dropped and not rounded. reviewer_notes is copied from the idea. scout is a dict with exactly the keys finding_id, motive, evidence_url in that order. When the idea's source is the string scout, finding_id is the idea's source_ref and motive is its scout_motive; for any other source both are None. evidence_url is always None. concepts in the result has one dict for each id in concept_ids, in that order, with exactly the keys file, model, prompt, seed in that order: model, prompt and seed are copied from the concept with that id, and file is the name that numbered("concept", ...) gives that concept's file_path at its place in the ticked order. If an id in concept_ids is not the id of one of the concepts passed in, raise ValueError. An empty concept_ids gives an empty list. reference_images in the result is numbered("ref", reference_images), whatever the concepts are. A lane, source_ref or reviewer_notes of None stays None.
impl: package.py filenames.py confirm.py
test: inbox/hopper_package_test.py
expect_sha256: 3c6c5c4ed9ffc3a13b57b660ae1ec2349ea2d2d3041bb1f2902fd367688107fe
