# The first Hopper slice: from a vote to tonight's list. Three files, 120 lines.
# The test file is the contract Grok ruled on. It is never sent to the model.
# There is no solution to this task anywhere in this repository, and there must not be one.
id: hopper-votes
kind: r3
prose: Write three Python modules for an idea bank. All of them are pure: they never read a file, open a socket, start a process or look at the clock; every time is a timezone-aware datetime passed in. votes.py defines apply_tap(votes, idea_id, user, at). votes is a dict whose keys are (idea_id, user) tuples and whose values are the datetime the vote was cast. One person has at most one vote on an idea. If (idea_id, user) is not in votes, the result has it with the value at. If it is already there, the result does not have it: a second tap takes the vote back. Return a new dict and never change the dict passed in. scores.py defines vote_score(times, now, half_life_days=14). times is a list of datetimes. Return a float: the sum over the times of 0.5 raised to the power (age in days divided by half_life_days), where age in days is (now - time) as seconds divided by 86400, not rounded. An empty list gives 0.0. shortlist.py defines two functions. next_state(state, score, bar) returns the string Shortlisted when state is the string Submitted and score is at or above bar; in every other case it returns state unchanged, so an idea that is already Shortlisted stays Shortlisted when its score is below the bar, and Generated, Reviewed, Promoted and Parked never change. pick_for_night(ideas, n=5) takes a list of dicts with the keys id, state, score and created (a datetime) and returns a list of ids: only ideas whose state is Shortlisted, ordered by highest score first, then by oldest created first, then by lowest id, and at most n of them. It must not reorder or change the list passed in.
impl: votes.py scores.py shortlist.py
test: inbox/hopper_votes_test.py
expect_sha256: 19f599c97c0d49c5ab8db6b417b390218f5777b8eb8490208208b87165ca97f6
